name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check
      SUPABASE_SERVICE_ROLE_KEY: build-check
      NEXT_PUBLIC_APP_URL: https://naetwork.dk
      APP_BASE_URL: https://naetwork.dk
      NEXT_PUBLIC_LEGAL_NAME: Naetwork
      NEXT_PUBLIC_LEGAL_ADDRESS: Build-check
      NEXT_PUBLIC_LEGAL_REGISTRATION: Build-check
      SUPPORT_EMAIL: kontakt@naetwork.dk

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
